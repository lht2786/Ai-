<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办事项 · Todo</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8b949e;
      --accent: #4f6ef7;
      --accent-hover: #3b5bde;
      --danger: #e5534b;
      --border: #e5e7eb;
      --done: #9aa3ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, sans-serif;
      background: linear-gradient(160deg, #eef1ff 0%, var(--bg) 40%, #f6f8fa 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30, 42, 80, 0.08);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 16px;
    }
    header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .add-bar {
      display: flex;
      gap: 10px;
      padding: 0 28px 20px;
    }
    .add-bar input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .add-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .15);
    }
    .add-bar button {
      padding: 0 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .add-bar button:hover { background: var(--accent-hover); }

    .filters {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 28px 14px;
      flex-wrap: wrap;
    }
    .filters button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 20px;
      cursor: pointer;
      transition: all .15s;
    }
    .filters button:hover { background: #f0f2f5; color: var(--text); }
    .filters button.active {
      background: rgba(79, 110, 247, .12);
      color: var(--accent);
      border-color: rgba(79, 110, 247, .3);
    }
    .filters .count {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
    }

    ul.list {
      list-style: none;
      padding: 0 12px;
      max-height: 50vh;
      overflow-y: auto;
    }
    ul.list:empty::after {
      content: "暂无事项，添加一条开始吧 ✨";
      display: block;
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 14px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      transition: background .12s;
    }
    li:hover { background: #f6f7f9; }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    li .todo-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
      cursor: pointer;
      transition: color .12s;
    }
    li.done .todo-text {
      color: var(--done);
      text-decoration: line-through;
    }
    li .edit-input {
      flex: 1;
      font-size: 15px;
      padding: 6px 10px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      outline: none;
    }
    li .del {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      opacity: 0;
      transition: opacity .12s, background .12s, color .12s;
    }
    li:hover .del { opacity: 1; }
    li .del:hover { background: rgba(229, 83, 75, .12); color: var(--danger); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px 22px;
    }
    footer button {
      font-size: 13px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
    }
    footer button:hover { color: var(--danger); }
    footer button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>待办事项</h1>
      <div class="sub">双击事项可编辑 · 数据自动保存在本地</div>
    </header>

    <div class="add-bar">
      <input id="newTodo" type="text" placeholder="添加新事项，回车确认…" />
      <button id="addBtn">添加</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="active">未完成</button>
      <button data-filter="done">已完成</button>
      <span class="count" id="count"></span>
    </div>

    <ul class="list" id="list"></ul>

    <footer>
      <button id="clearDone" disabled>清除已完成</button>
    </footer>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'todo.items.v1';

      const $ = (id) => document.getElementById(id);
      const listEl = $('list');
      const inputEl = $('newTodo');
      const countEl = $('count');
      const clearBtn = $('clearDone');

      let items = load();
      let filter = 'all';

      // —— 数据持久化 ——
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const data = raw ? JSON.parse(raw) : [];
          return Array.isArray(data) ? data : [];
        } catch (e) {
          return [];
        }
      }
      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      // —— 渲染 ——
      function render() {
        const visible = items.filter((t) => {
          if (filter === 'active') return !t.done;
          if (filter === 'done') return t.done;
          return true;
        });

        listEl.innerHTML = '';
        visible.forEach((t) => listEl.appendChild(buildItem(t)));

        const activeCount = items.filter((t) => !t.done).length;
        countEl.textContent = `共 ${items.length} 项 · 未完成 ${activeCount} 项`;
        clearBtn.disabled = items.every((t) => !t.done);

        document.querySelectorAll('.filters button').forEach((b) => {
          b.classList.toggle('active', b.dataset.filter === filter);
        });
      }

      function buildItem(todo) {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todo.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;
        text.title = '双击编辑';

        text.addEventListener('dblclick', () => startEdit(li, todo, text));

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = '删除';
        del.addEventListener('click', () => {
          items = items.filter((t) => t !== todo);
          save();
          render();
        });

        li.append(checkbox, text, del);
        return li;
      }

      function startEdit(li, todo, textEl) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'edit-input';
        input.value = todo.text;

        li.replaceChild(input, textEl);
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

        let finished = false;
        function finish(commit) {
          if (finished) return;
          finished = true;
          const val = input.value.trim();
          if (commit && val) {
            todo.text = val;
            save();
          }
          render();
        }

        input.addEventListener('blur', () => finish(true));
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') finish(true);
          else if (e.key === 'Escape') finish(false);
        });
      }

      // —— 添加 ——
      function addTodo() {
        const val = inputEl.value.trim();
        if (!val) return;
        items.push({ id: Date.now(), text: val, done: false });
        inputEl.value = '';
        save();
        render();
        inputEl.focus();
      }

      // —— 事件绑定 ——
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addTodo();
      });
      $('addBtn').addEventListener('click', addTodo);

      document.querySelectorAll('.filters button').forEach((b) => {
        b.addEventListener('click', () => {
          filter = b.dataset.filter;
          render();
        });
      });

      clearBtn.addEventListener('click', () => {
        items = items.filter((t) => !t.done);
        save();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
